[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-chatroom-ledger"
version = "0.1.0"
description = "A durable file-backed multi-agent chatroom with cursors, lenses, compile policy, and verification."
requires-python = ">=3.11"
license = {file = "LICENSE.md"}

[project.scripts]
agent-chatroom-ledger = "agent_chatroom_ledger.cli:main"

[tool.setuptools.packages.find]
include = ["agent_chatroom_ledger*"]
